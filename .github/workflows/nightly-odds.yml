name: Nightly playoff odds

# Layer 1 production job (docs/automation.md): pull results → simulate →
# write a dated JSON snapshot → commit. Runs on GitHub's runners because the
# simulator is cheap CPU and needs no credentials; Modal is reserved for
# Bayesian refits.
on:
  schedule:
    # Minutes are deliberately odd. GitHub delivers the schedule event on
    # best effort and drops it under load; the start of an hour is the
    # worst window, and :00/:15/:30/:45 are where everyone else is. Of the
    # five slots this repo had due on round minutes, two fired and both
    # were hours late (see docs/automation.md). Do not tidy these back to
    # round numbers.
    #
    # Three slots because the event is unreliable, and redundancy is free:
    # the script never overwrites a dated snapshot, so a later run of the
    # same day only refreshes latest.json.
    - cron: "23 9 * * *"     # 09:23 UTC ≈ 5:23am ET, after West Coast finals
    - cron: "7 12 * * *"     # 12:07 UTC backup
    - cron: "53 14 * * *"    # 14:53 UTC last chance
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the market snapshot job: both commit to main.
concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      # Station C + E, the whole per-game chain (docs/playoff-odds-validation.md,
      # "the full chain is wired"). It pulls every pitcher's and every hitter's
      # game log for the season — ~1,500 player-seasons, eight at a time — so
      # the run is 1m34 against 1m25 for the starter term alone. A fetch that
      # fails leaves the job printing a warning and shipping team-strength
      # odds rather than failing.
      - name: Simulate season and write snapshot
        run: python scripts/run_playoff_odds.py --sims 20000
      # BAS-72: refresh only 2026's rows of the committed contact-quality
      # monthly artifact before the projection step below reads it — the
      # `contact` engine (src/projections/ros.py, wired to every hitter
      # component: docs/contact-quality.md §4) needs this season's Statcast
      # buckets, and the file is otherwise static. `--update-season` rebuilds
      # 2015-2025's rows not at all: it loads the committed parquet, replaces
      # only the 2026 rows, and stamps the JSON sidecar
      # `check_freshness.py` watches (`contact_quality_monthly.meta.json`).
      # `statcast/statcast_2026.parquet` is the same R2 object
      # `statcast-ingest.yml` refreshes nightly, so this reads whatever that
      # workflow shipped most recently. A failure here is not fatal to the
      # rest of the run: the engine falls back to `marcel_tuned` for any
      # component whose contact fit cannot be built
      # (`ros.engine_providers`), so `|| true` keeps a stale Statcast fetch
      # from taking the whole board down with it.
      - name: Refresh this season's contact-quality features
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: >
          python scripts/build_contact_quality.py --download
          --update-season 2026 || true

      # Station A, live (docs/ros-projections.md). Marcel fed the season to
      # date x station B's projected PA, written to public/data/projections/.
      # Since Sept 3 the same file also carries the pitcher block: the tuned
      # pitcher Marcel's rates times a structural batters-faced projection.
      # Since BAS-72 the hitter rates are the `contact` engine wherever it
      # cleared the gate, built on the contact-quality artifact the step
      # above just refreshed. Needs the 2026 PA parquet from R2 and the MLB
      # Stats API; without either it keeps the last committed file and marks
      # it stale rather than failing, so no `|| true` is needed — the script
      # exits 0 by design.
      - name: Build rest-of-season projections
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/build_ros_projections.py

      # Station H, the accuracy page. Sections that cannot be rebuilt fall back
      # to the last committed snapshot and are marked stale on the page, so a
      # missing input never fails the nightly job — hence `|| true` is not
      # needed here, the script exits 0 by design.
      #
      # Secrets that would make the page complete on this runner:
      #   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT_URL / R2_BUCKET_NAME
      #     → downloads market/market_closes_2026.parquet so the per-game table
      #       carries the Kalshi and Polymarket closing-line rows, and
      #       pa_outcomes/pa_outcomes_2026.parquet so the rest-of-season
      #       sections — the hitter one and the pitcher one — and the
      #       projection step above can be rebuilt. Without them those sections
      #       render with a stale badge.
      # (boto3 is not in requirements-ci.txt, so the download is skipped there
      # too; add it alongside the secrets when they are configured.)
      - name: Build accuracy page data
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/build_accuracy_json.py

      - name: Commit snapshot
        run: |
          git config user.name "nightly-odds-bot"
          git config user.email "nightly-odds-bot@users.noreply.github.com"
          git add public/data/playoff_odds/ public/data/accuracy/ public/data/projections/ \
                  data/features/contact_quality_monthly.parquet \
                  data/features/contact_quality_monthly.meta.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: playoff odds + accuracy + rest-of-season snapshot $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi
