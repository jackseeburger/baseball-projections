name: Market snapshot

# Station M (docs/architecture.md): archive Kalshi + Polymarket MLB prices.
# Three slots a day: morning, ~1h before the first pitch, and after the
# late games close. Every run writes an immutable timestamped file, so
# duplicates are harmless and misses only cost resolution.
#
# Sportsbook lines (The Odds API) are pulled on the two daytime slots only:
# each pull costs 4 of a 500/month quota, so two a day is ~240/month.
on:
  schedule:
    # Odd minutes on purpose — see nightly-odds.yml for why, and note the
    # slots across all four production workflows are spaced at least an
    # hour apart so two can never pile up in the data-commits group below.
    - cron: "41 10 * * *"    # 10:41 UTC — morning
    - cron: "37 16 * * *"    # 16:37 UTC — before the 1pm ET slate
    - cron: "11 23 * * *"    # 23:11 UTC — before the 7pm ET slate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Snapshot markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # books only on the 10:00 / 16:30 slots and manual runs
          BOOKS: ${{ github.event.schedule != '0 23 * * *' && '--books' || '' }}
        run: |
          if [ -n "$BOOKS" ] && [ -z "$ODDS_API_KEY" ]; then
            echo "::warning::ODDS_API_KEY not set; skipping sportsbook lines"
            BOOKS=""
          fi
          python scripts/snapshot_market.py $BOOKS
      # BAS-77 Stage 0, docs/bankroll.md. It runs *here* rather than in
      # nightly-odds.yml for two reasons. First, the ledger's two outputs live
      # under data/market/ and public/data/market/, which is exactly what this
      # job's commit step already stages — nightly-odds stages only
      # public/data/{playoff_odds,accuracy,projections} and would leave the
      # parquet uncommitted, which for an append-only ledger is worse than not
      # running at all. Second, a ticket may only be priced from a snapshot
      # taken before first pitch, so the useful moment to emit is immediately
      # after a snapshot is written; running here gives all three slots a
      # chance to emit and to settle, instead of one a day hours after the
      # games have finished.
      #
      # No credentials: it reads the committed archive. Its own refusal — a
      # committed ledger the snapshot archive cannot explain — exits non-zero
      # and fails the job on purpose. That is a corrupted history, not a bad
      # day, and it should stop the run rather than append to it.
      - name: Emit and settle the paper ledger
        run: python scripts/paper_ledger.py --latest
      - name: Commit snapshot
        run: |
          git config user.name "market-snapshot-bot"
          git config user.email "market-snapshot-bot@users.noreply.github.com"
          git add data/market/ public/data/market/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: market snapshot + paper ledger $(date -u +%FT%H%MZ)"
            git pull --rebase origin main
            git push
          fi
